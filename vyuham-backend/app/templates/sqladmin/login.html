{% extends "sqladmin/base.html" %}
{% block body %}
<div class="container" style="max-width: 34rem; margin: 3rem auto;">
  <h1>Vyuham '26 Admin</h1>
  <p>Paste a Supabase access token for an account whose profile role is <code>admin</code>.</p>
  <form action="{{ url_for('admin:login') }}" method="POST">
    <div class="mb-3">
      <label class="form-label" for="access_token">Supabase access token</label>
      <textarea class="form-control" id="access_token" name="access_token" rows="6" required autocomplete="off"></textarea>
    </div>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
