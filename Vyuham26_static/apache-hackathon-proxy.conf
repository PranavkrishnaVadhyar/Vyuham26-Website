# Add inside the existing HTTPS VirtualHost for vyuham.duk.ac.in.
# Enable modules: proxy, proxy_http, proxy_ssl, ssl, headers.
# Reload Apache after adding this to the active VirtualHost configuration.

SSLProxyEngine On
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Prefix "/hackathon"

# Exact portal root and every nested route stay on the DUK origin.
ProxyPass        "/hackathon/" "https://vyuham26hms.vercel.app/hackathon/" nocanon
ProxyPassReverse "/hackathon/" "https://vyuham26hms.vercel.app/hackathon/"
ProxyPass        "/hackathon"  "https://vyuham26hms.vercel.app/hackathon/" nocanon
ProxyPassReverse "/hackathon"  "https://vyuham26hms.vercel.app/hackathon/"

# Next.js assets and PWA endpoints commonly use origin-root paths. These need
# a Vercel build configured with basePath=/hackathon and a worker scoped there;
# do not proxy /sw.js at the DUK origin because that would control the whole site.
