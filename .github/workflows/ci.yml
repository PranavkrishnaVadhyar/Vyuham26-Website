name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Vyuham26_frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Vyuham26_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Build Standalone Single-File Distribution
        run: npm run build

      - name: Build Optimized Split Distribution & Analyze
        run: npm run build:analyze

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vyuham-production-build
          path: Vyuham26_frontend/dist/
          retention-days: 7
